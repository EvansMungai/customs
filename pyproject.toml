[project]
name = "customs"
authors = [
    { name = "Bailly Rurangirwa", email = "rubailly@gmail.com"}
]
description = "A configurable Customs Declaration Processing module for Frappe, supporting import/export workflows, automated tax assessment, and cargo clearance."
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    # "frappe~=15.0.0" # Installed and managed by bench.
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

# These dependencies are only installed when developer mode is enabled
[tool.bench.dev-dependencies]
